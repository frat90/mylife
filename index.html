<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7fb">
<meta name="description" content="My Life OS — il tuo cruscotto personale.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>My Life OS</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">M</div>
      <div><strong>My Life OS</strong><span>Il tuo cruscotto</span></div>
    </div>
    <nav>
      <button class="nav active" data-page="home"><i>⌂</i>Dashboard</button>
      <button class="nav" data-page="money"><i>€</i>Money</button>
      <button class="nav" data-page="trading"><i>↗</i>Trading</button>
      <button class="nav" data-page="car"><i>🚗</i>Auto</button>
      <button class="nav" data-page="food"><i>🍷</i>Food & Wine</button>
      <button class="nav" data-page="fitness"><i>♥</i>Forma</button>
      <button class="nav" data-page="goals"><i>★</i>Obiettivi</button>
    </nav>
    <div class="sidebar-bottom">
      <button id="exportBtn">↓ Backup dati</button>
      <label>↑ Ripristina<input id="importInput" type="file" accept="application/json" hidden></label>
      <button id="resetBtn" class="danger-link">↺ Azzera dati</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button id="menuBtn" class="menu">☰</button>
      <div><span class="overline">PERSONAL LIFE OS</span><h1 id="title">Dashboard</h1></div>
      <div class="date" id="date"></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-bg"></div><div class="sheet"><button id="close" class="close">×</button><div id="modalBody"></div></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
